<!DOCTYPE html>
<html>

<head>

    <title>SterliFlux - Register</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #333;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login a {
            color: #111;
            font-weight: bold;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .success {
            background: #e5f7e9;
            color: #176b2c;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 12px;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>SterliFlux</h1>

    <div class="subtitle">
        Create your financial advisor account
    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="{{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <div class="login">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>

</html>
